apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: grafana-dashboard-focusflow
    files:
      - focusflow-overview.json=dashboard-focusflow.json
      - focusflow-logs.json=dashboard-logs.json

resources:
  - configmaps.yaml
  - deployment.yaml
  - service.yaml
