name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - run: pip install black flake8

      - name: black
        run: black --check apps/ config/ tests/

      - name: flake8
        run: flake8 apps/ config/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: ci-dummy-secret-key-not-used-in-production-xj9k2m
      DJANGO_SETTINGS_MODULE: config.settings.development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-security-

      - run: pip install -r requirements.txt bandit pip-audit

      - name: bandit
        run: bandit -r apps/ config/ -ll -ii --skip B105

      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: focusflow-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
