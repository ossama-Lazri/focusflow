<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | FocusFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F8FAFC;">
  <div style="text-align:center;padding:3rem;">
    <p style="font-size:6rem;font-weight:800;color:#E2E8F0;margin:0;line-height:1;">404</p>
    <h1 style="font-size:1.5rem;font-weight:600;color:#0F172A;margin:1rem 0 0.5rem;">Page not found</h1>
    <p style="color:#64748B;margin-bottom:2rem;">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.625rem 1.25rem;background:#0F172A;color:white;border-radius:8px;text-decoration:none;font-weight:500;font-size:0.875rem;">
      Back to Dashboard
    </a>
  </div>
</body>
</html>
