apiVersion: v1
kind: ConfigMap
metadata:
  name: focusflow-config
  namespace: focusflow
  labels:
    app.kubernetes.io/name: focusflow
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: focusflow-platform
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  ALLOWED_HOSTS: "localhost,127.0.0.1,focusflow.local,*.focusflow.local,*"
  CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://localhost:9000,http://focusflow.local"
  DATABASE_PATH: "/app/data/db.sqlite3"
  PORT: "8000"
  AWS_REGION: "us-east-1"
  AWS_STORAGE_BUCKET_NAME: "focusflow-local-media"
  AWS_S3_ENDPOINT_URL: "http://focusflow-localstack:4566"
