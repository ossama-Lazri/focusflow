apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: focusflow-ingress
  namespace: focusflow
  labels:
    app.kubernetes.io/name: focusflow
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: focusflow-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: focusflow.local
      http:
        paths:
          - path: /health/
            pathType: Exact
            backend:
              service:
                name: focusflow-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: focusflow-service
                port:
                  number: 80
    - host: localhost
      http:
        paths:
          - path: /health/
            pathType: Exact
            backend:
              service:
                name: focusflow-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: focusflow-service
                port:
                  number: 80
