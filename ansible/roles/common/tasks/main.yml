---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install baseline system dependencies
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - rsync
    state: present

- name: Ensure application group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
    system: true

- name: Ensure application user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
